<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
  <title>BRHSIC Academy — Plataforma de Ensino</title>
  <meta name="description" content="A plataforma de ensino oficial da BRHSIC Academy. Educação financeira e matemática com trilhas para o Ensino Médio." />

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#172237" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BRHSIC" />
  <link rel="apple-touch-icon" href="/src/assets/favicon.svg" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- App Styles (Vite will bundle these if imported in main.jsx, but we can leave them here or import them in main.jsx. Better to import them in main.jsx) -->

  <!-- Favicon -->
  <link rel="icon" href="https://brhsic-main.vercel.app/brand/brhsic-symbol.png" />
</head>
<body>
  <div id="root"></div>

  <!-- Global Error Handler -->
  <script>
    window.addEventListener('error', function(e) {
      document.body.innerHTML += '<div style="color:red; padding:20px; font-family:monospace; background:white; z-index:9999; position:fixed; top:0; left:0; width:100%;"><h3>App Error</h3><p>' + e.message + '</p></div>';
    });
  </script>

  <!-- Vite Entry Point -->
  <script type="module" src="/src/main.jsx"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {
          console.log('[PWA] Service Worker registrado com sucesso no escopo:', reg.scope);
        }).catch(function(err) {
          console.log('[PWA] Falha ao registrar Service Worker:', err);
        });
      });
    }
  </script>
</body>
</html>
