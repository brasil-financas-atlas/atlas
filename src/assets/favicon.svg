<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bfa-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B6B3A" />
      <stop offset="100%" stop-color="#124827" />
    </linearGradient>
    <linearGradient id="bfa-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#255588" />
      <stop offset="100%" stop-color="#1B3A5C" />
    </linearGradient>
    <linearGradient id="bfa-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5AD4F" />
      <stop offset="100%" stop-color="#C8963E" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10243C" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Shield / Hexagon -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bfa-blue-grad)" filter="url(#shadow)" />

  <!-- Gold Ring Accent (Atlas Globe Latitude) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#bfa-gold-grad)" stroke-width="16" stroke-dasharray="700 80" transform="rotate(-30 256 256)" opacity="0.9" />

  <!-- Atlas / Financial Growth Arc (Green) -->
  <path d="M 120 340 C 180 390, 320 390, 392 310" fill="none" stroke="url(#bfa-green-grad)" stroke-width="24" stroke-linecap="round" />
  
  <!-- Upward Trend Line with Arrow (Gold) -->
  <path d="M 140 320 L 220 250 L 290 290 L 390 170" fill="none" stroke="url(#bfa-gold-grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 340 170 L 390 170 L 390 220" fill="none" stroke="url(#bfa-gold-grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

  <!-- BFA Diamond / Globe Axis Center -->
  <polygon points="256,120 296,180 256,240 216,180" fill="url(#bfa-gold-grad)" />
  
  <!-- Decorative Node Points -->
  <circle cx="140" cy="320" r="12" fill="#E8F5ED" />
  <circle cx="220" cy="250" r="12" fill="#E8F5ED" />
  <circle cx="290" cy="290" r="12" fill="#E8F5ED" />
  <circle cx="390" cy="170" r="14" fill="#FDF6EC" />
</svg>
