site_name: Brasil Finanças Atlas
site_description: Trilhas abertas de matemática e finanças para estudantes do ensino médio.
site_url: https://lucas-guimaraes-silva.github.io/bfa/
repo_url: https://github.com/lucas-guimaraes-silva/bfa
repo_name: bfa

theme:
  name: material
  language: pt-BR

  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono

  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo escuro

    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro

  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tooltips
    - toc.follow

extra_css:
  - stylesheets/design.css   # painel de controle: cores e formatos (mexa aqui)
  - stylesheets/extra.css    # máquina do visual (só mexa se souber CSS)

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lucas-guimaraes-silva/bfa

