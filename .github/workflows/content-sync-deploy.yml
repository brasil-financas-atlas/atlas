name: BFA Content Sync & Automated Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'plataforma/src/data/overrides.json'
      - 'docs/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Rebuild Content Dataset
        run: |
          python build_exact_data.py || true

      - name: Deploy Status Notification
        run: |
          echo "Novo conteúdo sincronizado e pronto para Netlify/GitHub Pages!"
